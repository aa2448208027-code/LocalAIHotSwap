[server]
host = "127.0.0.1"
port = 18080
state_path = ".hotmodel/state.json"
active_model = "qwen3-small"
switch_policy = "zero_overlap"
switch_drain_timeout_seconds = 300
gpu_settle_timeout_seconds = 20
gpu_settle_memory_mb = 256

[session]
max_session_messages = 80
max_prompt_chars = 24000
max_prompt_tokens = 6144
token_budget_mode = "auto"
token_budget_chars_per_token = 4.0

[preset]
system_prompt = "You are a concise local assistant. Preserve the user's context across model switches."

[llama]
backend_mode = "router"
binary = "llama-server"
host = "127.0.0.1"

[router]
port = 28000
models_preset = "llama-models.example.ini"
models_max = 1
models_autoload = false
ctx_size = 8192
parallel = 1
cache_type_k = "q8_0"
cache_type_v = "q8_0"
kv_unified = true
cache_ram_mb = 1024
cache_idle_slots = true
flash_attn = "auto"
no_webui = true
extra_args = ["--metrics"]

[models.qwen3-small]
path = "C:/models/Qwen3-small-instruct-q4_k_m.gguf"
router_id = "qwen3-small"
port = 28080
ctx_size = 8192
gpu_layers = 999
parallel = 1
extra_args = ["--jinja", "--cache-reuse", "256"]

[models.qwen3-tiny]
path = "C:/models/Qwen3-tiny-instruct-q4_k_m.gguf"
router_id = "qwen3-tiny"
port = 28081
ctx_size = 8192
gpu_layers = 999
parallel = 1
extra_args = ["--jinja", "--cache-reuse", "256"]
